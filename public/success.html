<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo/monddt-icon-square.svg" />
  <link rel="apple-touch-icon" href="/assets/logo/monddt-icon-square.svg" />
  <title>Synthèse envoyée — monddt.fr</title>
  <meta name="robots" content="noindex,nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { navy: { 50:'#f0f4f8',100:'#d9e2ec',200:'#bcccdc',500:'#486581',600:'#334e68',700:'#243b53',800:'#102a43',900:'#0a1f33' } } } },
    };
  </script>
  <!-- Umami Web Analytics (cookieless) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="e0ba03bc-2256-4fe2-bdfe-0d11b83c3577"></script>
  <!-- Ahrefs Web Analytics -->
  <script src="https://analytics.ahrefs.com/analytics.js" data-key="m9ef1uR/ZG9DTI3c7BGg1Q" async></script>
</head>
<body class="bg-white text-navy-800 font-sans antialiased min-h-screen flex flex-col">

  <header class="border-b border-navy-100 bg-white">
    <div class="max-w-6xl mx-auto px-6 py-4">
      <a href="/" class="text-xl font-bold text-navy-800">monddt<span class="text-navy-500">.fr</span></a>
    </div>
  </header>

  <main class="flex-1 w-full max-w-xl mx-auto px-6 py-16 flex items-center">
    <div class="w-full bg-white border border-navy-100 rounded-2xl p-8 md:p-10 shadow-sm text-center">
      <div class="w-16 h-16 mx-auto rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-3xl font-bold mb-6">&#10003;</div>

      <h1 class="text-2xl md:text-3xl font-bold text-navy-900 mb-4">Votre synthèse a été envoyée</h1>

      <p class="text-navy-700 leading-relaxed mb-2">
        Votre synthèse a été envoyée à <strong id="recipient-email">votre adresse email</strong>.
      </p>
      <p class="text-navy-600 mb-6">
        Vérifiez votre boîte mail (et les <strong>spams</strong>).
      </p>

      <p class="text-navy-500 text-sm mb-8">
        Vous ne recevez rien dans 5&nbsp;minutes&nbsp;? Contactez <a href="mailto:contact@monddt.fr" class="underline hover:text-navy-700">contact@monddt.fr</a>.
      </p>

      <a href="/" class="inline-block bg-navy-800 hover:bg-navy-700 text-white font-semibold px-6 py-3 rounded-lg transition">
        Analyser un autre dossier
      </a>
    </div>
  </main>

  <footer class="bg-navy-900 text-navy-100 py-6">
    <div class="max-w-6xl mx-auto px-6 text-center text-xs">
      &copy; 2026 monddt.fr — <a href="/cgv.html" class="hover:text-white">CGV</a> · <a href="/rgpd.html" class="hover:text-white">RGPD</a> · <a href="/mentions-legales.html" class="hover:text-white">Mentions légales</a>
    </div>
  </footer>

  <script>
    (function () {
      var email = new URLSearchParams(location.search).get('email');
      if (email) {
        var el = document.getElementById('recipient-email');
        // textContent escapes; safe to display the user's own email back to them
        el.textContent = email;
      }
    })();
  </script>

</body>
</html>
