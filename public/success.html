  <script>
    (function () {
      var email = new URLSearchParams(location.search).get('email');
      if (email) {
        var el = document.getElementById('recipient-email');
        // textContent escapes; safe to display the user's own email back to them
        el.textContent = email;
      }
    })();
  </script>

  <script>
    /* Theme toggle wiring. Syncs <html class="dark"> + toggle UI + localStorage. */
    (function () {
      var toggles = document.querySelectorAll('.theme-toggle');
      if (!toggles.length) return;
      function apply(theme) {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        toggles.forEach(function (t) {
          t.classList.toggle('is-dark', theme === 'dark');
          t.classList.toggle('is-light', theme !== 'dark');
          t.querySelectorAll('[data-theme]').forEach(function (b) {
            b.setAttribute('aria-checked', b.dataset.theme === theme ? 'true' : 'false');
          });
        });
        try { localStorage.setItem('monddt-theme', theme); } catch (e) {}
      }
      apply(document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      toggles.forEach(function (t) {
        t.addEventListener('click', function (e) {
          var btn = e.target.closest('[data-theme]');
          if (btn) apply(btn.dataset.theme);
        });
      });
    })();
  </script>
