[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npx tailwindcss -i src/styles.css -o public/dist/styles.css --minify"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
  publish = "public"
  functions = "netlify/functions"
  port = 8888

# Security headers (added 2026-05-17 via web-quality-toolkit audit)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    # Content-Security-Policy: starts in Report-Only mode (logs violations
    # without blocking). Promote to enforcing Content-Security-Policy after
    # verifying no legit resources are getting blocked. Sources allow-listed:
    #   - 'self' for everything on monddt.fr
    #   - cdn.tailwindcss.com (Tailwind CDN that injects runtime styles)
    #   - js-de.sentry-cdn.com + ingest.sentry.io (error tracking, EU-hosted)
    #   - analytics.ahrefs.com (Ahrefs Web Analytics)
    #   - cloud.umami.is (Umami self-hosted analytics)
    #   - pagead2.googlesyndication.com + Google ad domains (AdSense)
    #   - data: + https: for img-src (AdSense/Sentry beacons load from many origins)
    #   - 'unsafe-inline' for script-src (Tailwind config, theme detection,
    #     rotating-words logic — all are tiny inline blocks; nonce/hash
    #     migration is a separate task)
    #   - 'unsafe-inline' for style-src (Tailwind generates inline <style>)
    # CSP enforcing mode (Report-Only verified clean in private window, no violations).
    # Tailwind migrated from CDN to local PostCSS build, so 'unsafe-eval' and
    # cdn.tailwindcss.com both dropped from script-src.
    # api-gateway.umami.dev is the Umami event-send endpoint (cloud.umami.is
    # only hosts the script.js; events post to api-gateway.umami.dev).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js-de.sentry-cdn.com https://browser.sentry-cdn.com https://analytics.ahrefs.com https://cloud.umami.is https://pagead2.googlesyndication.com https://www.googletagservices.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.de.sentry.io https://cloud.umami.is https://api-gateway.umami.dev https://analytics.ahrefs.com https://pagead2.googlesyndication.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
